[package]
name = "sftp-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Two-way folder sync with a baseline three-way reconcile (first-run-never-deletes, keep-both conflicts). Backend-agnostic: implement the small RemoteFs trait over any remote (SFTP, S3, local, …)."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/a6avind/sftp-sync"
homepage = "https://github.com/a6avind/sftp-sync"
documentation = "https://docs.rs/sftp-sync"
keywords = ["sync", "sftp", "rsync", "mirror", "backup"]
categories = ["filesystem", "network-programming", "asynchronous"]
exclude = ["/.github"]

[features]
# Ready-made SFTP backend (off by default): russh transport + built-in SFTP client.
sftp = [
    "dep:russh",
    "dep:bytes",
    "dep:serde_bytes",
    "dep:bitflags",
    "dep:thiserror",
    "dep:chrono",
    "dep:dashmap",
    "dep:tokio-util",
    "dep:log",
    "serde/derive",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
]
# check-file extension: server-side content hashing (ProFTPD etc; not OpenSSH).
check-file = ["sftp"]

[dependencies]
tokio = { version = "1", features = ["fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
sha2 = "0.11"
# --- sftp backend ---
russh = { version = "0.61", optional = true }
bytes = { version = "1", optional = true }
serde_bytes = { version = "0.11", optional = true }
bitflags = { version = "2", features = ["serde"], optional = true }
thiserror = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
dashmap = { version = "6", optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["rt"], optional = true }
log = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }

[package.metadata.docs.rs]
all-features = true
